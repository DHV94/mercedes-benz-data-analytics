version: 2

models:
  - name: silver_sales
    description: "Una fila por venta (sale_id), con el modelo y el tipo de impuesto resueltos."
    columns:
      - name: sale_id
        data_tests:
          - unique
          - not_null

      - name: sale_date
        data_tests:
          - not_null:
              config:
                severity: warn
                store_failures: true

      - name: model_variant_code
        data_tests:
          - not_null
      
      - name: tax_type_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['VAT_STANDARD', 'VAT_REDUCED']