version: 2

# Bronze is loaded by Snowflake (COPY INTO), not by dbt. dbt only declares it here and reads it.
# Bronze exists only in DEV and every environment reads it (D-038, D-067). The database comes from
# the variable DBT_BRONZE_DB; if it is not defined it falls back to DEV_MB_BRONZE_DB.
sources:
  - name: bronze_sales
    database: "{{ env_var('DBT_BRONZE_DB', 'DEV_MB_BRONZE_DB') }}"
    schema: sales
    tables:
      - name: raw_sales_eu
        description: "Raw Europe sales, every column VARCHAR, plus _source_file, _file_row_number, _loaded_at."

  - name: bronze_crm
    database: "{{ env_var('DBT_BRONZE_DB', 'DEV_MB_BRONZE_DB') }}"
    schema: crm
    tables:
      - name: raw_dealer_master
        description: "Raw dealer master of every delivery (one row per dealer and file)."

  - name: bronze_nhtsa
    database: "{{ env_var('DBT_BRONZE_DB', 'DEV_MB_BRONZE_DB') }}"
    schema: nhtsa
    tables:
      - name: raw_recalls
        description: "Real NHTSA recalls of Mercedes-Benz vehicles (2021-2025), one row per campaign, model text, year and component. Text as it comes."
